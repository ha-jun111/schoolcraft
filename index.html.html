function updateHoop(dt){
 if(!game||!hoopView||!document.querySelector('#basket3d'))return;
 const h=hoopView;
 if(game.flying){
  game.flight+=dt;const t=Math.min(game.flight/1.55,1);
  // Physical-looking arc from the avatar's hands to the basket.
  const endX=game.hit?0:2.15;
  h.ball.position.set(endX*t,2.55+(4.35-2.55)*t+3.4*4*t*(1-t),2.7+(-9.2-2.7)*t);
  h.ball.rotation.x+=dt*9;
  const lift=Math.min(game.flight/.28,1);
  h.left.rotation.x=-2.45*lift;h.right.rotation.x=-2.45*lift;
  if(t>=1){
   game.flying=false;
   if(game.hit){game.score++;document.querySelector('#result').textContent='🎉 골인! 아바타가 슛을 성공했어요!'}
   else document.querySelector('#result').textContent='아쉬워요! 공이 골대를 빗나갔어요.';
   document.querySelector('#score').textContent=`성공 ${game.score} / ${game.shots}회 (총 5번)`;

   else document.querySelector('#shoot').disabled=false;
  }
 }else{h.ball.position.set(0,2.1,2.75);h.left.rotation.x=0;h.right.rotation.x=0;}
 h.re.render(h.sc,h.ca);

// AABB collision: 벽/책장/책상/배식대/의자/골대 및 NPC에 적용.
// 바닥의 얇은 표시, 장식 간판, 머리보다 높은 장식은 장애물에서 제외.
function collectIndoorSolids(){
 indoorSolids=[];
 roomWorld.updateMatrixWorld(true);
 const box=new THREE.Box3();
 roomWorld.traverse(o=>{
  if(!o.isMesh || !o.geometry || o.geometry.type!=='BoxGeometry') return;
  box.setFromObject(o);
  if(box.max.y<.38 || box.min.y>2.9 || box.max.y-box.min.y<.18)return;
  // 바닥 전체와 천장 장식은 통과 판정에서 제외
  if(box.max.x-box.min.x>23 && box.max.z-box.min.z>23)return;
  indoorSolids.push({x:(box.min.x+box.max.x)/2,z:(box.min.z+box.max.z)/2,w:box.max.x-box.min.x,d:box.max.z-box.min.z});
 });
}
function hitSolid(x,z,rad=.48,npcSelf=null){
 if(inside){
  if(x < -11.45+rad || x > 11.45-rad || z < -11.45+rad || z > 11.45-rad)return true;
 }else if(x < -39 || x > 39 || z < -38 || z > 46)return true;
 const obstacles=inside?indoorSolids:outdoorSolids;
 for(const b of obstacles){
  const dx=Math.max(Math.abs(x-b.x)-b.w/2,0),dz=Math.max(Math.abs(z-b.z)-b.d/2,0);
  if(dx*dx+dz*dz<rad*rad)return true;
 }
 if(!inside){
  for(const n of npcs){if(n===npcSelf || !n.a.visible)continue;
   if(Math.hypot(x-n.a.position.x,z-n.a.position.z)<rad+.45)return true;
  }
 }
 if(npcSelf && Math.hypot(x-player.position.x,z-player.position.z)<rad+.48)return true;
 return false;
}
function moveWithCollision(entity,dx,dz,radius=.48,npcSelf=null){
 // substeps avoid tunneling through thin obstacles on slow devices
 const steps=Math.max(1,Math.ceil(Math.hypot(dx,dz)/.22));
 for(let i=0;i<steps;i++){
  const nx=entity.position.x+dx/steps,nz=entity.position.z+dz/steps;
  if(!hitSolid(nx,entity.position.z,radius,npcSelf))entity.position.x=nx;
  if(!hitSolid(entity.position.x,nz,radius,npcSelf))entity.position.z=nz;
 }
}
