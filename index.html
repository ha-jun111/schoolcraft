<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>우리학교 블록월드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* VOICE: playful, warm, made for kids — a toy, not a dashboard
   IDEA: a blocky toy school you walk around in, like a pixel sticker book
   PICTURE: the 3D world fills the whole screen; HUD is chunky stickers on top
   COLOUR and TYPE: sky blue, grass green, sunny yellow buttons, dark brown ink; Jua everywhere
   LAYOUT: place pill top-left, menu top-right, joystick bottom-left, action buttons bottom-right */
:root{color-scheme:light;--ink:#2b2118;--paper:#fffaf0;--sun:#ffd23f;--leaf:#7ed957;--sky:#7cc4ff;--rose:#ff8a8a}
[hidden]{display:none!important}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#9edcff;font-family:Jua,system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);user-select:text;-webkit-user-select:text}
.btn{border:3px solid var(--ink);background:#fff;border-radius:12px;padding:9px 16px;font-size:17px;box-shadow:0 4px 0 var(--ink);min-height:44px;line-height:1.2}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.opt:focus-visible,.sw:focus-visible{outline:3px solid #3d8bfd;outline-offset:2px}
.btn.y{background:var(--sun)}.btn.g{background:var(--leaf)}.btn.b{background:var(--sky)}.btn.r{background:var(--rose)}
.btn.on{background:var(--leaf)}
#top{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.pill{background:rgba(255,250,240,.95);border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-size:17px;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.tb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tb .btn{padding:5px 10px;font-size:15px;min-height:40px;box-shadow:0 3px 0 var(--ink)}
#joy{position:fixed;width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.3);border:3px solid rgba(43,33,24,.5);left:22px;bottom:26px;z-index:4;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:16px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
#rb{position:fixed;right:12px;bottom:20px;display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:5}
#rb .row3{display:flex;gap:8px}
#bAct{font-size:20px;padding:12px 20px;background:var(--sun);max-width:calc(100vw - 180px);animation:bob 1.2s ease-in-out infinite}
#bAct2{font-size:17px;background:#fff}
.round{width:58px;height:58px;border-radius:50%;padding:0;font-size:15px}
@keyframes bob{50%{transform:translateY(-4px)}}
#toast{position:fixed;left:50%;top:62px;transform:translateX(-50%);z-index:8;max-width:min(92vw,480px);text-align:center;pointer-events:none;transition:opacity .3s}
#toast.gold{background:var(--sun)}
#dg,#cl{position:fixed;left:50%;top:58px;transform:translateX(-50%);z-index:6;display:flex;gap:10px;align-items:center}
#dg .hearts{color:#e8467c;font-size:22px;letter-spacing:2px}
#dg .btn,#cl .btn{min-height:36px;padding:4px 10px;font-size:14px}
#modal{position:fixed;inset:0;background:rgba(20,30,40,.45);display:grid;place-items:center;z-index:20;padding:12px}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);width:min(560px,100%);max-height:calc(100dvh - 24px);overflow:auto;padding:20px 18px;position:relative;touch-action:pan-y;font-size:17px;line-height:1.5}
.card h1{font-size:28px;margin:0 40px 6px 0;line-height:1.1;font-weight:400}
.card h2{font-size:22px;margin:6px 0 12px;font-weight:400;line-height:1.3}
.card p{margin:6px 0}
.x{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:22px;line-height:1;padding:0}
.meta{color:#7a6a58;font-size:15px}
.opts{display:grid;gap:10px;margin:8px 0}
.opt{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:12px 14px;font-size:18px;text-align:left;min-height:52px;box-shadow:0 3px 0 var(--ink)}
.opt.ok{background:var(--leaf)}.opt.no{background:var(--rose)}
.exp{background:#fff3c4;border-radius:12px;padding:10px 12px}
.stars{font-size:44px;color:#f5b301;letter-spacing:4px;text-align:center}
.list{display:grid;gap:8px;margin:10px 0}
.item{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 12px}
.item.today{background:#fff3c4}
.item b{font-weight:400;font-size:18px}
.foods{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.food{border:2px solid var(--ink);border-radius:999px;padding:4px 10px;background:#fff;font-size:16px;display:flex;align-items:center;gap:6px}
.food i{width:14px;height:14px;border-radius:4px;border:2px solid var(--ink);display:inline-block}
textarea,input[type=text],input[type=password],input[type=month],input:not([type]){width:100%;border:3px solid var(--ink);border-radius:12px;padding:10px;background:#fff}
textarea{min-height:140px;resize:vertical}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.tabs .btn{font-size:15px;padding:6px 10px;min-height:40px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:3px solid var(--ink);border-radius:999px;background:#fff;padding:6px 12px;min-height:40px}
.chip.on{background:var(--sun)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.stamp{border:3px dashed #bba98f;border-radius:16px;padding:12px 8px;text-align:center;color:#a8987f;background:#fff}
.stamp .dot{width:56px;height:56px;border-radius:50%;margin:0 auto 6px;border:3px solid #d8ccb9;display:grid;place-items:center;font-size:14px}
.stamp.got{border-style:solid;border-color:var(--ink);color:var(--ink)}
.stamp.got .dot{border-color:var(--ink);color:#fff;transform:rotate(-8deg)}
.small{font-size:14px;color:#7a6a58}
.bk{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start;margin:10px 0}
.cover{aspect-ratio:3/4;border:3px solid var(--ink);border-radius:8px 14px 14px 8px;box-shadow:inset 10px 0 0 rgba(0,0,0,.18),0 4px 0 var(--ink);padding:10px 8px 10px 18px;color:#fff;display:flex;flex-direction:column;justify-content:space-between}
.cover b{font-weight:400;font-size:17px;line-height:1.2;text-shadow:0 2px 0 rgba(0,0,0,.25);overflow-wrap:anywhere}.cover span{font-size:12px}
.bkinfo p{margin:8px 0}
@media(max-width:380px){.bk{grid-template-columns:96px 1fr}}
#start{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;justify-content:flex-end;pointer-events:none}
.sheet{pointer-events:auto;background:var(--paper);border-top:4px solid var(--ink);border-radius:24px 24px 0 0;max-height:58dvh;overflow:auto;padding:16px 16px 20px;touch-action:pan-y;box-shadow:0 -4px 0 rgba(0,0,0,.08)}
.sheet h1{margin:0;font-size:clamp(26px,6vw,38px);font-weight:400;line-height:1.05;text-wrap:balance}
.sheet .sub{margin:4px 0 10px;color:#6c5c4a}
.fl{display:block;margin:6px 0 10px}
.fl input{margin-top:4px}
.row{display:grid;grid-template-columns:5.5em 1fr;align-items:center;gap:8px;margin:8px 0}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:12px;border:3px solid var(--ink);padding:0}
.sw.on{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink)}
.big{width:100%;margin-top:10px;font-size:22px;min-height:56px}
#load{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#9edcff;font-size:24px;text-align:center;padding:20px}
#load .blk{width:44px;height:44px;margin:0 auto 14px;background:#7ed957;border:4px solid var(--ink);animation:spin 1s steps(4) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#hint{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);font-size:13px;color:#2b2118;background:rgba(255,250,240,.75);border-radius:999px;padding:2px 10px;z-index:3;white-space:nowrap}
.gbar{height:14px;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff;margin:8px 0}#tb{height:100%;background:var(--leaf);width:100%}
.g2{grid-template-columns:1fr 1fr}.g2 .opt{text-align:center;font-size:17px}
@media (max-width:600px){#hint{display:none}.tb .btn{font-size:14px;padding:4px 8px}}
@media (prefers-reduced-motion:reduce){#bAct{animation:none}#load .blk{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load"><div><div class="blk"></div><span id="loadmsg">학교를 짓는 중이에요…</span></div></div>
<div id="top">
  <div class="pill" id="place">학교 마당</div>
  <div class="tb">
    <button class="btn" id="bMove">이동</button>
    <button class="btn" id="bStamp">도장</button>
    <button class="btn" id="bMe">내 캐릭터</button>
    <button class="btn" id="bT">소리</button>
  </div>
</div>
<div id="dg" hidden><span class="pill"><span class="hearts" id="dgH">♥♥♥</span></span><span class="pill" id="dgS">홍팀 4명</span><button class="btn r" id="dgQ">그만하기</button></div>
<div id="cl" hidden><span class="pill" id="clS">청소 중</span><button class="btn r" id="clQ">그만하기</button></div>
<div id="toast" class="pill" style="opacity:0"></div>
<div id="joy"><div id="knob"></div></div>
<div id="rb">
  <div class="row3"><button class="btn" id="bAct2" hidden>내리기</button><button class="btn" id="bAct" hidden>행동</button></div>
  <div class="row3">
    <button class="btn round" id="bEmo">인사</button>
    <button class="btn round" id="bRun">달리기</button>
    <button class="btn round b" id="bJump">점프</button>
  </div>
</div>
<div id="hint">WASD·방향키 이동 · 스페이스 점프 · E 행동 · Shift 달리기 · 드래그로 시점 · 휠 확대</div>
<div id="modal" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
<div id="start" hidden>
  <div class="sheet">
    <h1 id="stTitle">우리학교 블록월드</h1>
    <p class="sub">내 캐릭터를 꾸미고 학교에 들어가 볼까요?</p>
    <label class="fl">이름<input id="nm" maxlength="8" placeholder="이름을 써요" autocomplete="off"></label>
    <div class="row"><span>머리 모양</span><div class="chips" id="oStyle"></div></div>
    <div class="row"><span>머리색</span><div class="sws" id="oHair"></div></div>
    <div class="row"><span>피부색</span><div class="sws" id="oSkin"></div></div>
    <div class="row"><span>윗옷</span><div class="sws" id="oShirt"></div></div>
    <div class="row"><span>바지</span><div class="sws" id="oPants"></div></div>
    <div class="row"><span>동물 친구</span><div class="chips" id="oPet"></div></div>
    <button class="btn y big" id="go">학교 가기</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem('ws_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('ws_'+k,JSON.stringify(v))}catch(e){}}};
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, PI=Math.PI, R=Math.random;
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const pick=a=>a[Math.floor(R()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function angLerp(a,b,t){const d=((b-a+PI)%(2*PI)+2*PI)%(2*PI)-PI;return a+d*t}
let seed=20261126;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const WD=['일','월','화','수','목','금','토'];
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dLabel(k){const [y,m,d]=k.split('-').map(Number);const dt=new Date(y,m-1,d);return `${m}월 ${d}일 (${WD[dt.getDay()]})`}

if(typeof THREE==='undefined'){ $('#loadmsg').textContent='3D 엔진을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.'; }
else { const go=()=>{try{main()}catch(e){console.error(e);$('#loadmsg').textContent='앗, 문제가 생겼어요: '+e.message}};
  Promise.race([document.fonts?document.fonts.load('40px Jua'):Promise.resolve(),new Promise(r=>setTimeout(r,1500))]).then(go,go); }

function main(){
/* ---------- renderer ---------- */
const canvas=$('#c');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'})}catch(e){$('#loadmsg').textContent='이 기기에서는 3D 화면을 열 수 없어요.';return}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9edcff);scene.fog=new THREE.Fog(0x9edcff,50,125);
const camera=new THREE.PerspectiveCamera(60,1,.1,230);
scene.add(new THREE.HemisphereLight(0xffffff,0x9c8a6a,.75));
const sunL=new THREE.DirectionalLight(0xfff1d6,.62);sunL.position.set(30,60,25);scene.add(sunL);
scene.add(new THREE.AmbientLight(0xffffff,.28));
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* ---------- pixel textures ---------- */
function tex(c,near=true){const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=near?THREE.NearestMipmapLinearFilter:THREE.LinearFilter;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
function pix(fn,S=16){const c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');const im=g.createImageData(S,S);for(let y=0;y<S;y++)for(let x=0;x<S;x++){const p=fn(x,y);const i=(y*S+x)*4;im.data[i]=p[0];im.data[i+1]=p[1];im.data[i+2]=p[2];im.data[i+3]=255}g.putImageData(im,0,0);return tex(c)}
const vary=(c,a)=>{const k=(rnd()-.5)*a;return[clamp(c[0]+k|0,0,255),clamp(c[1]+k|0,0,255),clamp(c[2]+k|0,0,255)]};
const BOOKC=[[214,69,65],[66,135,245],[250,190,60],[90,170,90],[160,90,200],[240,130,60],[60,180,190]];
const TX={
 noise:pix(()=>{const v=212+rnd()*43|0;return[v,v,v]}),
 grass:pix(()=>rnd()<.08?[140,215,95]:vary([98,182,66],26)),
 dirt:pix(()=>rnd()<.06?[172,126,82]:vary([208,166,112],22)),
 sand:pix(()=>vary([244,224,166],18)),
 stone:pix((x,y)=>((x*7+y*13)%23===0)?[124,124,128]:vary([172,172,176],22)),
 planks:pix((x,y)=>{const r=y>>2;if((y&3)===3||((x+r*5)&15)===0)return[122,84,46];return vary([r%2?198:186,r%2?146:136,88],14)}),
 gym:pix((x,y)=>{const c=x>>2;if((x&3)===3||((y+c*7)&15)===0)return[178,128,72];return vary([232,188,124],10)}),
 cream:pix((x,y)=>{const r=y>>2,o=r%2?4:0;if((y&3)===3||((x+o)&7)===7)return[224,208,178];return vary([250,238,208],10)}),
 brick:pix((x,y)=>{const r=y>>2,o=r%2?4:0;if((y&3)===3||((x+o)&7)===7)return[204,194,184];return vary([188,84,64],18)}),
 tile:pix((x,y)=>{if((x&7)===7||(y&7)===7)return[202,202,198];return((x>>3)+(y>>3))%2?vary([240,240,234],8):vary([214,228,240],8)}),
 mint:pix((x,y)=>{if((x&7)===7||(y&7)===7)return[190,210,200];return((x>>3)+(y>>3))%2?vary([238,246,240],8):vary([200,234,216],8)}),
 plaster:pix(()=>vary([248,246,238],8)),
 books:pix((x,y)=>{if(y===7||y===15||y===0)return[122,84,46];const k=((x>>1)*3+(y>>3)*5)%BOOKC.length;if(((x>>1)+(y>>3)*3)%6===0&&(y&7)<3)return[90,62,34];return vary(BOOKC[k],16)}),
 glass:pix((x,y)=>{if(x===0||y===0||x===15||y===15)return[255,255,255];if(x===y||x===y+1)return[236,248,255];return[172,216,246]}),
 leaves:pix(()=>rnd()<.15?[48,112,48]:vary([80,164,72],30)),
 log:pix(x=>vary(x%4===0?[96,66,40]:[130,92,58],16)),
 shoe:pix((x,y)=>{if((x&7)===0||(y&7)===0)return[150,120,90];return vary([232,216,188],8)}),
 soccer:pix((x,y)=>(((x>>2)+(y>>2)*2)%3===0)?[40,40,40]:[250,250,250]),
};
const MATS={};
function mat(k){if(MATS[k])return MATS[k];let m;
 if(k[0]==='#')m=new THREE.MeshLambertMaterial({map:TX.noise,color:new THREE.Color(k)});
 else if(k==='glass')m=new THREE.MeshLambertMaterial({map:TX.glass,transparent:true,opacity:.62,depthWrite:false});
 else m=new THREE.MeshLambertMaterial({map:TX[k]});
 return MATS[k]=m}

/* ---------- merged static block builder ---------- */
const G={}, RECTS=[];
function box(k,x0,y0,z0,x1,y1,z1,solid=false,cam=false){
 if(x0>x1)[x0,x1]=[x1,x0];if(y0>y1)[y0,y1]=[y1,y0];if(z0>z1)[z0,z1]=[z1,z0];
 const g=G[k]||(G[k]={p:[],n:[],u:[],i:[]});
 const F=[[0,[1,0,0],[[x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1]]],[0,[-1,0,0],[[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]]],
  [1,[0,1,0],[[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0]]],[1,[0,-1,0],[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
  [2,[0,0,1],[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]],[2,[0,0,-1],[[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0]]]];
 for(const [ax,n,v] of F){const b=g.p.length/3;
  for(const q of v){g.p.push(q[0],q[1],q[2]);g.n.push(n[0],n[1],n[2]);g.u.push(ax===0?q[2]:q[0],ax===1?q[2]:q[1])}
  g.i.push(b,b+1,b+2,b,b+2,b+3)}
 if(solid)RECTS.push({x0,z0,x1,z1,y0,y1,cam});
}
function solid(x0,z0,x1,z1,y0,y1){RECTS.push({x0,z0,x1,z1,y0,y1,cam:false})}
function finalize(){for(const k in G){const g=G[k];const geo=new THREE.BufferGeometry();
 geo.setAttribute('position',new THREE.Float32BufferAttribute(g.p,3));geo.setAttribute('normal',new THREE.Float32BufferAttribute(g.n,3));
 geo.setAttribute('uv',new THREE.Float32BufferAttribute(g.u,2));geo.setIndex(g.i);
 const m=new THREE.Mesh(geo,mat(k));if(k==='glass')m.renderOrder=2;m.matrixAutoUpdate=false;scene.add(m)}}
const TH=.2;
function wX(x,za,zb,y0,y1,k='plaster'){box(k,x-TH,y0,za,x+TH,y1,zb,true,true)}
function wZ(z,xa,xb,y0,y1,k='plaster'){box(k,xa,y0,z-TH,xb,y1,z+TH,true,true)}

/* ---------- canvas signs ---------- */
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function fitText(g,t,x,y,maxW,size){let s=size;g.font=`${s}px Jua,sans-serif`;while(g.measureText(t).width>maxW&&s>10){s-=2;g.font=`${s}px Jua,sans-serif`}g.textAlign='center';g.textBaseline='middle';g.fillText(t,x,y)}
function plane(w,h,draw,px=110){const c=document.createElement('canvas');c.width=Math.round(w*px);c.height=Math.round(h*px);const g=c.getContext('2d');draw(g,c.width,c.height);const t=new THREE.CanvasTexture(c);t.anisotropy=4;
 const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent:true}));m.userData={c,g,t};scene.add(m);return m}
function redraw(m,draw){const {c,g,t}=m.userData;g.clearRect(0,0,c.width,c.height);draw(g,c.width,c.height);t.needsUpdate=true}
function at(m,x,y,z,ry=0){m.position.set(x,y,z);m.rotation.y=ry;return m}
const signDraw=(text,bg,fg)=>(g,W,H)=>{g.fillStyle=bg;rr(g,0,0,W,H,H*.2);g.fill();g.strokeStyle='rgba(0,0,0,.28)';g.lineWidth=H*.07;rr(g,H*.05,H*.05,W-H*.1,H-H*.1,H*.16);g.stroke();g.fillStyle=fg;fitText(g,text,W/2,H/2+H*.03,W*.86,H*.6)};
function sign(text,w,h,x,y,z,ry,bg='#2f6f4f',fg='#ffffff'){return at(plane(w,h,signDraw(text,bg,fg)),x,y,z,ry)}
function wrapItems(g,items,maxW,sep=' · '){const lines=[];let cur='';for(const it of items){const t=cur?cur+sep+it:it;if(g.measureText(t).width>maxW&&cur){lines.push(cur);cur=it}else cur=t}if(cur)lines.push(cur);return lines}
function wrapText(g,text,maxW){const out=[];let line='';for(const ch of text){const t=line+ch;if(g.measureText(t).width>maxW&&line){out.push(line);line=ch}else line=t}if(line)out.push(line);return out}

function sampleDays(){const days={};const now=new Date();let n=0;
 for(let mo=0;mo<2;mo++){const y=now.getFullYear(),m=now.getMonth()+mo;const last=new Date(y,m+1,0).getDate();
  for(let d=1;d<=last;d++){const dt=new Date(y,m,d);const w=dt.getDay();if(w===0||w===6)continue;n++;
   days[ymd(dt)]=w===5?['카레라이스',SM.soup[n%9],SM.side[n%9],SM.kim[n%2],SM.des[n%7]]:[SM.rice[n%5],SM.soup[(n*2)%9],SM.main[(n*3)%10],SM.side[(n*5)%9],SM.kim[n%2],SM.des[(n*4)%7]]}}
 return days}

function todayMenu(){const days=menuDays();const k=ymd(new Date());if(days[k])return{key:k,items:days[k],today:true};
 for(let i=1;i<21;i++){const d=new Date();d.setDate(d.getDate()+i);const kk=ymd(d);if(days[kk])return{key:kk,items:days[kk],today:false}}

function cleanItem(s){return s.replace(/\[[^\]]*\]/g,'').replace(/\([\d.,\s]*\)/g,'').replace(/\d+(\.\d+)*\.?/g,'').replace(/[*#@★☆※]/g,'').trim()}
function parseMenu(text,ym){let [Y,M]=ym.split('-').map(Number);const days={};let cur=null;
 for(const raw of text.split(/\r?\n/)){const line=raw.trim();if(!line)continue;let y=Y,m=M,d=null,mt=null,rest=line;
  if((mt=line.match(/^(\d{4})\s*[-.\/년]\s*(\d{1,2})\s*[-.\/월]\s*(\d{1,2})\s*일?/))){y=+mt[1];m=+mt[2];d=+mt[3];Y=y;M=m}
  else if((mt=line.match(/^(\d{1,2})\s*[\/.월]\s*(\d{1,2})\s*일?/))){m=+mt[1];d=+mt[2];M=m}
  else if((mt=line.match(/^(\d{1,2})\s*일?(?=[\s:)\].,(\-]|$)/))){d=+mt[1]}
  if(d&&d>=1&&d<=31&&m>=1&&m<=12){rest=line.slice(mt[0].length);cur=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;days[cur]=days[cur]||[]}
  if(!d&&(mt=line.match(/^(\d{4})\s*[-.\/년]\s*(\d{1,2})\s*월?\s*$/))){Y=+mt[1];M=+mt[2];cur=null;continue}
  if(/알레르기|^[*#]/.test(line)){cur=null;continue}
  if(!cur)continue;
  rest=rest.replace(/^\s*(\([월화수목금토일]\)|\[[월화수목금토일]\]|[월화수목금토일]요일)\s*/,'').replace(/^[\s:：\-–)\].]+/,'');
  let items=rest.split(d?/[,，·\/|、]+/:/[,，]+/).map(s=>s.trim()).filter(Boolean);
  if(d&&items.length===1&&/\s/.test(items[0])&&!/[,，]/.test(rest))items=items[0].split(/\s+/);
  days[cur].push(...items.map(cleanItem).filter(s=>s&&s.length<=20))}
 for(const k in days){days[k]=[...new Set(days[k])].slice(0,8);if(!days[k].length)delete days[k]}
 return days}

/* ---------- collision & ground ---------- */
function inStairs(x,z){return x>-3&&x<3&&z<-21&&z>-33}
function groundAt(x,z,y){if(x>-3&&x<3){if(z<-21&&z>-33&&y<7.6)return Math.min(5,.5*Math.ceil(-21-z));if(z<=-33&&z>-40&&y>2.5)return Math.min(10,5+.556*Math.ceil((-33-z)/.7))}if(x>-20&&x<20&&z>-40&&z<-10)return y>7.5?10:y>2.5?5:0;return 0}
function collide(x,z,y,r){
 for(let it=0;it<2;it++)for(let i=0;i<RECTS.length;i++){const q=RECTS[i];if(q.y1<=y+.3||q.y0>=y+1.6)continue;if(x<q.x0-r||x>q.x1+r||z<q.z0-r||z>q.z1+r)continue;
  const cx=x<q.x0?q.x0:x>q.x1?q.x1:x,cz=z<q.z0?q.z0:z>q.z1?q.z1:z;const dx=x-cx,dz=z-cz,d2=dx*dx+dz*dz;if(d2>=r*r)continue;
  if(d2>1e-9){const d=Math.sqrt(d2);x+=dx/d*(r-d);z+=dz/d*(r-d)}
  else{const l=x-q.x0,rt=q.x1-x,t=z-q.z0,b=q.z1-z,m=Math.min(l,rt,t,b);if(m===l)x=q.x0-r;else if(m===rt)x=q.x1+r;else if(m===t)z=q.z0-r;else z=q.z1+r}}
 return[x,z]}
let CAMR=[];
function camBlocked(x,y,z,py){
 for(const q of CAMR)if(x>q.x0-.15&&x<q.x1+.15&&z>q.z0-.15&&z<q.z1+.15&&y>q.y0-.1&&y<q.y1+.1)return true;
 if(x>-20&&x<20&&z>-40&&z<-10){if(y>14.75)return true;const s1=x>-3&&x<3&&z>-31&&z<-20,s2=x>-3&&x<3&&z>-40&&z<-33,L=py>7.5?2:py>2.5?1:0;
  if(y>[4.5,9.75,14.75][L]&&!(L===0&&s1)&&!(L===1&&s2))return true;
  if(y<[-9,5.15,10.15][L]&&!(L===1&&s1)&&!(L===2&&s2))return true}
 return false}

function say(n,text){if(n.bub){n.a.root.remove(n.bub);n.bub.material.map.dispose()}n.bub=textSprite(text,{bg:'rgba(255,255,255,.96)',fg:'#2b2118',h:.34,font:36});n.bub.position.y=2.55;n.a.root.add(n.bub);n.talk=3.6}
function updateNPCs(dt,t){
 for(const n of NPCS){
  if(n.talk>0){n.talk-=dt;n.spd=0;n.rot=angLerp(n.rot,Math.atan2(P.x-n.x,P.z-n.z),Math.min(1,dt*6));if(n.talk<=0&&n.bub){n.a.root.remove(n.bub);n.bub.material.map.dispose();n.bub=null}}
  else if(n.b){if(n.wait>0){n.wait-=dt;n.spd=0}else{const dx=n.tx-n.x,dz=n.tz-n.z,d=Math.hypot(dx,dz);
   if(d<.3||n.stuck>1.2){n.wait=1+R()*4;n.stuck=0;n.tx=lerp(n.b[0],n.b[2],R());n.tz=lerp(n.b[1],n.b[3],R())}
   else{const s=1.5;const ox=n.x,oz=n.z;let nx=n.x+dx/d*s*dt,nz=n.z+dz/d*s*dt;[nx,nz]=collide(nx,nz,n.y,.32);n.x=nx;n.z=nz;
    if(Math.hypot(n.x-ox,n.z-oz)<s*dt*.4)n.stuck+=dt;n.spd=s;n.rot=angLerp(n.rot,Math.atan2(dx,dz),Math.min(1,dt*8))}}}
  n.a.root.position.set(n.x,n.y,n.z);n.a.root.rotation.y=n.rot;pose(n.a,n.spd>.2?'walk':'idle',t+n.x,n.spd)}}
function updatePet(dt,t){if(!pet)return;
 const fx=Math.sin(P.rot),fz=Math.cos(P.rot);const bk=pet.fly?.45:1.1,sd=pet.fly?.6:.7;const tx=P.x-fx*bk+fz*sd,tz=P.z-fz*bk-fx*sd;const d=dist(pet.x,pet.z,tx,tz);
 if(d>14||Math.abs(pet.y-P.y)>2.2&&d>3){pet.x=tx;pet.z=tz;pet.y=P.y}
 let sp=0;if(d>.4){sp=Math.min(7,d*2.4);const dx=(tx-pet.x)/d,dz=(tz-pet.z)/d;let nx=pet.x+dx*sp*dt,nz=pet.z+dz*sp*dt;[nx,nz]=collide(nx,nz,pet.y,.22);pet.x=nx;pet.z=nz;pet.rot=angLerp(pet.rot,Math.atan2(dx,dz),Math.min(1,dt*8))}
 else pet.rot=angLerp(pet.rot,Math.atan2(P.x-pet.x,P.z-pet.z),Math.min(1,dt*3));
 const g=groundAt(pet.x,pet.z,pet.y);pet.y=lerp(pet.y,g,Math.min(1,dt*12));
 const hop=pet.hop?(sp>.5?Math.abs(Math.sin(t*9))*.22:0):(sp>.5&&!pet.fly?Math.abs(Math.sin(t*14))*.08:0),hov=pet.fly?1.75+Math.sin(t*3)*.08:0;
 pet.root.position.set(pet.x,pet.y+hop+hov,pet.z);pet.root.rotation.y=pet.rot;
 pet.tail.rotation.y=Math.sin(t*(pet.dog?14:3))*(pet.fly?.15:.5);if(!pet.fly&&!pet.hop)pet.legs.forEach((l,i)=>l.rotation.x=sp>.5?Math.sin(t*14+(i%2?PI:0))*.6:0);if(pet.wings)pet.wings.forEach((w,i)=>w.rotation.z=(i?1:-1)*(sp>.5?.35+Math.sin(t*24)*.6:.1+Math.sin(t*5)*.12));pet.head.rotation.z=sp>.5?0:Math.sin(t*1.5)*.1}

 if(/국|탕|찌개|스프|수프/.test(n))return'#e8a15a';if(/나물|시금치|샐러드|무침|브로콜리|채소|오이|상추/.test(n))return'#6ab04c';

function makeTray(items){const g=new THREE.Group();mb(.74,.05,.52,'#b8c4cc',0,0,0,g);mb(.74,.06,.04,'#a3b1ba',0,.04,.25,g);mb(.74,.06,.04,'#a3b1ba',0,.04,-.25,g);
 const list=items.slice();const take=re=>{const i=list.findIndex(n=>re.test(n));return i>=0?list.splice(i,1)[0]:null};
 const rice=take(/밥|죽|국수|면$/)||list.shift(),soup=take(/국|탕|찌개|스프|수프/),sides=list.slice(0,3);
 const foods=[];const put=(name,x,z,kind)=>{if(!name)return;const c=foodColor(name);let m;
  if(kind==='rice')m=mb(.28,.1,.2,c,x,.07,z,g);else if(kind==='soup'){mb(.3,.08,.22,'#e9eef1',x,.06,z,g);m=mb(.24,.04,.16,c,x,.1,z,g)}else m=mb(.17,.07,.15,c,x,.06,z,g);foods.push({name,m})};

 if(!HR.rival){HR.rival=makeAvatar(look(pick(NAMES)));scene.add(HR.rival.root)}HR.rival.root.visible=true;HR.rx=HX0;HR.rT=0;HR.rival.root.position.set(HX0,0,RZ);HR.rival.root.rotation.y=PI/2;

function updateHurdle(dt){
 for(const h of HR.hs)if(h.hit&&h.tip<1){h.tip=Math.min(1,h.tip+dt*4);h.g.rotation.z=-1.35*h.tip}
 if(P.state!=='hurdle'){if(HR.rival&&HR.rival.root.visible&&HR.phase!=='ready'&&HR.phase!=='run'&&modal.hidden)HR.rival.root.visible=false;return}
 yaw=angLerp(yaw,0,Math.min(1,dt*4));
 if(HR.phase==='ready'){HR.cnt-=dt;const n=Math.ceil(HR.cnt);if(n<HR.last&&n>0){HR.last=n;floatText(String(n),P.x,2.6,P.z,'#3d8bfd');sfx(440,.1)}
  if(HR.cnt<=0){HR.phase='run';HR.t0=T;floatText('출발!',P.x,2.6,P.z,'#e53935');sfx(880,.2)}P.hs=0;P.visY=P.y;pose(HR.rival,'idle',T,0);return}

 P.vy-=24*dt;P.y+=P.vy*dt;if(P.y<=0){P.y=0;P.vy=0;P.ground=true}else P.ground=false;P.visY=P.y;P.hs=sp;
 for(const h of HR.hs){if(h.done)continue;if(px<h.x&&P.x>=h.x){h.done=true;if(P.y<.55){h.hit=true;HR.knock++;HR.slow=.6;floatText('툭!',P.x,2.3,P.z,'#e67e22');sfx(140,.15,'sawtooth',.05)}else{HR.clear++;sfx(760,.06)}}}
 if(HR.rx<HX1){HR.rx+=6.1*dt;if(HR.rx>=HX1)HR.rT=T-HR.t0}

let curPlace='';
function updatePlace(){const p=placeName(P.x,P.z,P.y);if(p===curPlace)return;curPlace=p;$('#place').textContent=p;if(!started)return;
 if(TIPS[p])toast(p+' · '+TIPS[p]);else if(p.endsWith('반 교실'))toast(p+' · 칠판 앞에서 골든벨, 문 옆에서 청소 게임!');if(MAIN7.includes(p)&&!visited[p]){visited[p]=1;LS.set('visited',visited);if(MAIN7.every(k=>visited[k]))earn('explore')}}

/* ---------- creator ---------- */
let started=false,creating=false;
function openCreator(){if(P.state==='sit')standUp();creating=true;resetInput();$('#start').hidden=false;$('#nm').value=prof.name;renderOpts();
 $('#rb').hidden=true;joyEl.hidden=true;$('#top').hidden=true}
function renderOpts(){
 const sw=(id,arr,key)=>{$(id).innerHTML=arr.map(c=>`<button class="sw${prof[key]===c?' on':''}" style="background:${c}" data-v="${c}" aria-label="${key} ${c}"></button>`).join('');$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{prof[key]=b.dataset.v;renderOpts();buildMe()})};
 const ch=(id,arr,key)=>{$(id).innerHTML=arr.map(([v,l])=>`<button class="chip${prof[key]===v?' on':''}" data-v="${v}">${l}</button>`).join('');$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{prof[key]=b.dataset.v;renderOpts();buildMe()})};
 ch('#oStyle',STYLES,'style');sw('#oHair',HAIRS,'hair');sw('#oSkin',SKINS,'skin');sw('#oShirt',SHIRTS,'shirt');sw('#oPants',PANTS,'pants');ch('#oPet',PETS,'pet')}
$('#nm').addEventListener('change',()=>{prof.name=$('#nm').value.trim().slice(0,8);buildMe()});
$('#go').onclick=()=>{prof.name=$('#nm').value.trim().slice(0,8)||pick(NAMES);LS.set('me',prof);buildMe();creating=false;$('#start').hidden=true;$('#rb').hidden=false;joyEl.hidden=false;$('#top').hidden=false;camera.clearViewOffset();
 if(!started){started=true;P.rot=PI;yaw=0;toast(`${prof.name}, 우리 학교에 온 걸 환영해요!`)}sfx(523,.1);sfx(784,.12)};

/* ---------- camera ---------- */
const tgt=new THREE.Vector3();
function updateCamera(dt){
 if(creating){P.rot+=dt*.6;const W=innerWidth,H=innerHeight;camera.setViewOffset(W,H,0,H*.22,W,H);
  camera.position.set(P.x+Math.sin(PI*.15)*3.4,P.y+1.4,P.z+Math.cos(PI*.15)*3.4);camera.lookAt(P.x,P.y+1,P.z);return}
 tgt.set(P.x,P.visY+1.45,P.z);const cp=Math.cos(pitch),dx=Math.sin(yaw)*cp,dy=Math.sin(pitch),dz=Math.cos(yaw)*cp;
 let d=camDist;for(let s=.4;s<=camDist;s+=.2){if(camBlocked(tgt.x+dx*s,tgt.y+dy*s,tgt.z+dz*s,P.y)){d=Math.max(.5,s-.35);break}}
 curDist+=(d-curDist)*(d<curDist?.6:Math.min(1,dt*3));
 camera.position.set(tgt.x+dx*curDist,tgt.y+dy*curDist,tgt.z+dz*curDist);camera.lookAt(tgt);
 me.root.visible=curDist>1.05}

/* ---------- player update ---------- */
function updatePlayer(dt){
 if(P.state==='free'||P.state==='dodge'){
  let ix=joy.x+((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0),iy=joy.y+((keys.KeyW||keys.ArrowUp)?1:0)-((keys.KeyS||keys.ArrowDown)?1:0);
  if(!modal.hidden||creating)ix=iy=0;
  const m=Math.min(1,Math.hypot(ix,iy));const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  let mx=fx*iy+rx*ix,mz=fz*iy+rz*ix;const ml=Math.hypot(mx,mz);if(ml>0){mx/=ml;mz/=ml}
  const run=P.run||keys.ShiftLeft||keys.ShiftRight;const sp=m<.12?0:(run?6.6:4.2)*m*(P.tray?.85:1);
  const k=Math.min(1,dt*10);P.vx=lerp(P.vx,mx*sp,k);P.vz=lerp(P.vz,mz*sp,k);
  let nx=P.x+P.vx*dt,nz=P.z+P.vz*dt;[nx,nz]=collide(nx,nz,P.y,.35);
  if(P.state==='dodge'){nx=clamp(nx,-11.1,-3.7);nz=clamp(nz,-39.3,-20.7)}
  P.x=nx;P.z=nz;const hs=Math.hypot(P.vx,P.vz);
  if(hs>.4&&!(P.state==='dodge'&&P.thr>0))P.rot=angLerp(P.rot,Math.atan2(P.vx,P.vz),Math.min(1,dt*12));
  const g=groundAt(P.x,P.z,P.y);
  if(P.ground&&g<P.y&&P.y-g<.6)P.y=g;
  if(g>P.y&&g-P.y<.6){P.y=g;if(P.vy<0)P.vy=0}
  P.vy-=24*dt;P.y+=P.vy*dt;if(P.y<=g){P.y=g;P.vy=0;P.ground=true}else if(P.y>g+.05)P.ground=false;
  P.visY=P.ground?lerp(P.visY,P.y,Math.min(1,dt*18)):P.y;
  if(iy>.3&&hs>1&&T-lastDrag>1.5&&P.state==='free')yaw=angLerp(yaw,Math.atan2(-P.vx,-P.vz),Math.min(1,dt*1.1*iy));
  P.hs=hs}
 else if(P.state==='climb'){let ix=joy.x+((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0),iy=joy.y+((keys.KeyW||keys.ArrowUp)?1:0)-((keys.KeyS||keys.ArrowDown)?1:0);if(!modal.hidden)ix=iy=0;
  const m=Math.min(1,Math.hypot(ix,iy));const mx=-Math.sin(yaw)*iy+Math.cos(yaw)*ix,mz=-Math.cos(yaw)*iy-Math.sin(yaw)*ix,ml=Math.hypot(mx,mz)||1,sp=m<.12?0:1.8*m;
  P.vx=mx/ml*sp;P.vz=mz/ml*sp;P.x=clamp(P.x+P.vx*dt,JG.x0,JG.x1);P.z=clamp(P.z+P.vz*dt,JG.z0,JG.z1);if(sp>.2)P.rot=angLerp(P.rot,Math.atan2(P.vx,P.vz),Math.min(1,dt*10));
  const ty=P.lv+.06;P.mvY=Math.abs(ty-P.y)>.05;P.y=lerp(P.y,ty,Math.min(1,dt*6));P.visY=P.y;P.vy=0;P.ground=true;P.hs=sp}
 else if(P.state!=='hurdle')P.hs=0;
 P.emote=Math.max(0,P.emote-dt);P.wash=Math.max(0,(P.wash||0)-dt);P.eat=Math.max(0,P.eat-dt);P.thr=Math.max(0,P.thr-dt);
 me.root.position.set(P.x,P.visY,P.z);me.root.rotation.y=P.rot;
 const st=(P.state==='sit'||P.state==='swing'||P.state==='seesaw'||(P.state==='slide'&&P.sl>1.2))?'sit':P.hs>.5||(P.state==='slide')?'walk':'idle';
 pose(me,P.state==='climb'?'idle':st,T,P.state==='slide'?3:P.hs,{rub:P.wash>0,climb:P.state==='climb',mv:P.hs>.2||P.mvY,cheer:P.state==='seesaw'&&P.y>.45||P.state==='climb'&&P.lv===3&&P.hs<.2,hold:!!P.tray&&P.state!=='sit',wave:P.emote>0,eat:P.eat>0,throw:P.state==='dodge'&&(DG.holder===DG.ents[0]||P.thr>0)});
 if(P.state==='dodge'&&DG.inv>0)me.root.visible=me.root.visible&&Math.floor(T*12)%2===0}

/* ---------- boot ---------- */
buildWorld();finalize();CAMR=RECTS.filter(r=>r.cam);refreshBoards();loadFiles();spawnNPCs();buildMe();
SB.m.position.copy(SB.p);
let last=performance.now(),actLabel='';
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
 updateHurdle(dt);updateClean(dt);updatePlayer(dt);updateRides(dt);if(DG.ents.length)dgUpdate(dt,T);updateNPCs(dt,T);updatePet(dt,T);updateSoccer(dt);updateFX(dt);
 for(const c of CLOUDS){c.position.x+=dt*1.2;if(c.position.x>90)c.position.x=-90}
 updateCamera(dt);updatePlace();
 curAct=(modal.hidden&&!creating)?findAction():null;const lab=curAct&&curAct.l?curAct.l:'',lab2=curAct&&curAct.l2?curAct.l2:'';if(lab+'|'+lab2!==actLabel){actLabel=lab+'|'+lab2;bAct.hidden=!lab;bAct.textContent=lab;bAct2.hidden=!lab2;bAct2.textContent=lab2}
 renderer.render(scene,camera)}
requestAnimationFrame(frame);
$('#load').hidden=true;
if(LS.get('me',null)){started=true;P.rot=PI;$('#place').textContent=placeName(P.x,P.z,P.y);curPlace=$('#place').textContent;toast(`${prof.name||'친구'}, 다시 왔구나! 반가워요.`)}
else openCreator();
}
}
